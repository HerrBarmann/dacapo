# ============================================================================
# GitHub Actions — dacapo
#   check:        syntax, ansible-lint, render all demo profiles, shellcheck,
#                 Python byte-compile, Raspberry Pi firstrun generation
#   docker-test:  full playbook run per demo profile in a debian:trixie
#                 container (installs sway, Firefox ESR ...), twice (idempotence)
#   idle-chain:   live headless sway session per demo profile: idle warning,
#                 input during the countdown, reset, screensaver
# ============================================================================
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --quiet ansible ansible-lint
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Syntax check
        run: ansible-playbook --syntax-check -i localhost, local.yml
      - name: ansible-lint
        run: ansible-lint local.yml roles/ vars/ tests/render.yml
      - name: Render all demo profiles
        run: |
          for p in examples/site-demo/profiles/*.yml; do
            ansible-playbook -i localhost, tests/render.yml -e profile="$(basename "$p" .yml)"
          done
      - name: Shell scripts
        run: |
          shellcheck -S warning preseed/build-iso.sh preseed/build-iso-docker.sh raspberry/make-firstrun.sh \
            tests/docker-test.sh tests/idle-chain-test.sh tests/compare-render.sh tools/site-var.sh tools/make-screenshots.sh roles/firefox/files/kiosk-fullscreen-watch.sh
          shellcheck -S warning -s bash tests/out/site-demo/browser/kiosk-firefox.sh tests/out/site-demo/browser/kiosk-reset.sh \
            tests/out/site-demo/browser/kiosk-idle-warn.sh tests/out/site-demo/browser/kiosk-screensaver.sh
      - name: Python
        run: python3 -m py_compile roles/monitor/files/kiosk-monitor.py roles/usbmanager/files/usbmanager.py roles/fleet/files/kiosk-fleet.py tools/screenshots/compose.py
      - name: Raspberry Pi firstrun (with a non-placeholder pull URL)
        run: |
          cp -r examples/site-demo /tmp/site
          sed -i 's#https://CHANGE_ME_USER:CHANGE_ME_TOKEN@git.example.org#https://user:token@git.example.org#' /tmp/site/secrets.yml
          (cd raspberry && ./make-firstrun.sh display /tmp/site) && bash -n raspberry/firstrun.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-templates
          path: tests/out/
          retention-days: 7

  docker-test:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        profile: [browser, app, display]
    steps:
      - uses: actions/checkout@v4
      - name: Full playbook run in debian:trixie (${{ matrix.profile }})
        run: tests/docker-test.sh ${{ matrix.profile }}

  idle-chain:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        profile: [browser, app, display]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: python -m pip install --quiet ansible
      - name: Live idle chain in a headless sway session (${{ matrix.profile }})
        run: tests/idle-chain-test.sh ${{ matrix.profile }}
