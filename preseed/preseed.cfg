#_preseed_V1
# ============================================================================
# dacapo — Debian 13 (trixie) preseed (debian-installer), ALL profiles.
# Placeholders @@...@@ are filled by build-iso.sh from the site. The profile
# arrives at boot as the kernel parameter kiosk.profile=<name> from the boot
# menu (one ISO for all profiles); if missing, @@PROFILE@@ applies.
# Installs only the base OS + git/ansible/ssh and then bootstraps the actual
# kiosk configuration with ansible-pull from the site repository. This file is
# therefore stable and rarely changed; all kiosk details live in the site and
# the core and are maintained centrally.
#
# Embedding into the netinst ISO: ./build-iso.sh (docs/deployment.md).
# ============================================================================

### Localisation
d-i debian-installer/locale string @@LOCALE@@
d-i keyboard-configuration/xkb-keymap select @@KEYMAP@@

### Time (otherwise UTC -> nightly reboot and clock are off)
d-i clock-setup/utc boolean true
d-i time/zone string @@TIMEZONE@@
d-i clock-setup/ntp boolean true

### Network: DHCP on the first connected interface.
d-i netcfg/choose_interface select auto
# "auto" takes the first interface WITH link. The default link timeout of 3 s
# is too short on switch ports with spanning tree — d-i would then fall back
# to the Wi-Fi card and ask for SSID/passphrase. Therefore: wait.
d-i netcfg/link_wait_timeout string 45
d-i netcfg/get_hostname string kiosk
d-i netcfg/get_domain string unassigned-domain
# The final unique hostname (<prefix>-<MAC suffix>) is set in late_command.

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Users: root locked; local ADMIN account (NOT the kiosk user).
# Hash: mkpasswd --method=sha-512 (package whois) or openssl passwd -6
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Kiosk Admin
d-i passwd/username string @@ADMIN_USER@@
d-i passwd/user-password-crypted password @@ADMIN_PASSWORD_HASH@@

### Partitioning: whole disk, ONE ext4 root partition, NO swap.
# No swap on purpose: the kiosk home lives in RAM (tmpfs). With swap, private
# session data could be paged out to the SSD and defeat zero persistence.
# (An EFI partition is created automatically on UEFI systems, BIOS works too.)
d-i partman-auto/method string regular
# Target disk automatically: the first detected disk (the installer stick
# itself is excluded by list-devices). Needed because hardware is
# heterogeneous (sda vs. nvme0n1) — without this line the installer asks.
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
# Do not ask if the disk still holds a BIOS/MBR system while installing via
# UEFI ("Force UEFI installation?").
d-i partman-efi/non_efi_system boolean true
d-i partman-auto/expert_recipe string \
  kiosk-root :: \
    538 538 1075 free \
      $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } \
    . \
    2000 10000 -1 ext4 \
      $primary{ } $bootable{ } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ / } \
    .
d-i partman-auto/choose_recipe select kiosk-root
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false

### Package selection: base + SSH + bootstrap tools. No desktop task — the
# kiosk "desktop" (sway) is installed by local.yml itself.
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string git ansible ca-certificates
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### GRUB onto the installation disk
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finish:
# 1. Unique hostname <prefix>-<last 6 hex digits of the MAC>.
# 2. Profile from /proc/cmdline (kiosk.profile=) or placeholder; write the
#    marker file.
# 3. Bootstrap with ansible-pull (runs in the chroot of the target system;
#    local.yml is chroot-safe: services are only enabled, started at boot).
# IMPORTANT: preseed values must NOT contain backslash sequences (\n, \.) —
# debconf interprets them as escapes when reading and breaks the command.
# @@CA_COMMANDS@@ installs the site CA first if the site has one (ca.crt is
# put into the installer initrd by build-iso.sh and then lives under /).
d-i preseed/late_command string \
  @@CA_COMMANDS@@ \
  in-target sh -c 'mkdir -p /dev/shm; mount -t tmpfs shm /dev/shm || true'; \
  in-target sh -c 'M=$(cat /sys/class/net/e*/address 2>/dev/null | head -n1 | tr -dc "a-f0-9" | tail -c 6); \
    if [ -z "$M" ]; then M=$(tr -dc "a-f0-9" < /dev/urandom | head -c 6); fi; \
    V=@@PROFILE@@; \
    for A in $(cat /proc/cmdline); do case $A in kiosk.profile=*) V=${A#kiosk.profile=};; esac; done; \
    case $V in @@PREFIX_CASES@@ *) P=$V;; esac; \
    H="$P-$M"; \
    echo "$H" > /etc/hostname; \
    echo "127.0.0.1 localhost" > /etc/hosts; \
    echo "127.0.1.1 $H" >> /etc/hosts; \
    echo "::1 localhost ip6-localhost ip6-loopback" >> /etc/hosts; \
    mkdir -p @@STATE_DIR@@; \
    echo "$V" > @@PROFILE_FILE@@'; \
  in-target sh -c 'export PYTHONUNBUFFERED=1; V=$(cat @@PROFILE_FILE@@); ansible-pull -v -U @@PULL_URL@@ -i localhost, --checkout @@BRANCH@@ -e profile=$V @@PLAYBOOK@@ > /var/log/kiosk-bootstrap.log 2>&1'

### Automatic reboot into the finished kiosk system
d-i finish-install/reboot_in_progress note
