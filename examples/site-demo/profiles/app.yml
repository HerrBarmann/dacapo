---
# ============================================================================
# Profile "app" — terminal for ONE web application (e.g. room booking).
# Firefox WITHOUT browser chrome (no address bar, no tabs, no bookmarks), only
# the application and its login provider are reachable, reset after 90 s.
# The home page is a local launch page; Firefox does not start on the app
# itself so an expired login page never stays on screen after a reset.
# ============================================================================
kiosk_profile_title: "Demo Kiosk — Booking terminal"
hostname_prefix: terminal                 # devices are named terminal-<MAC suffix>

# ---- Session -----------------------------------------------------------------
idle_reset_enabled: true
idle_seconds: 90
idle_warn_seconds: 30
screensaver_enabled: false                # the launch page itself is the "screensaver"
screen_off_enabled: false
hide_cursor: false
output_transform: normal

# ---- Bar ---------------------------------------------------------------------
waybar_enabled: true
waybar_layer: overlay                     # stays visible even above fullscreen
text_bar_brand: "Room booking"
text_bar_hint: "The session ends after {{ idle_seconds }} seconds without input · Please sign out after booking"
waybar_usb_button: false
usb_enabled: false

# ---- Firefox -----------------------------------------------------------------
firefox_mode: app                         # chrome hidden with userChrome.css
homepage_template: homepage-app.html.j2
firefox_extensions: []
# Watchdog against F11/JavaScript fullscreen (would hide the bar with the
# "end session" button).
fullscreen_guard_enabled: true
monitor_enabled: false

# The application (launch button and allowed destinations)
app_url: "https://booking.example.org"
app_help_url: "https://example.org/help/booking"

firefox_policies_profile:
  # ONLY the application and its login provider are reachable, plus the local
  # home page. WebsiteFilter applies to top-level navigation; assets (CDNs)
  # still load.
  WebsiteFilter:
    Block: ["<all_urls>"]
    Exceptions:
      - "{{ app_url }}/*"
      - "https://*.example.org/*"
      - "file:///opt/kiosk/*"
  DisplayBookmarksToolbar: "never"
