---
# ============================================================================
# Demo site — SECRETS. In a real site repository this file holds the deploy
# token and the admin password hash; the repository must be private.
# Values below are placeholders: the installer refuses to build while a
# CHANGE_ME is left.
# ============================================================================

# ansible-pull URL of the SITE repository incl. read-only deploy token. The
# site repository contains dacapo as the submodule "core".
kiosk_pull_url: "https://CHANGE_ME_USER:CHANGE_ME_TOKEN@git.example.org/org/kiosk-site.git"
kiosk_pull_branch: main
kiosk_pull_playbook: core/local.yml

# Local admin password for the console (SSH is key-only). Create the hash with
#   mkpasswd --method=sha-512        (Debian: package whois)
#   openssl passwd -6                (macOS: brew install openssl@3)
install_admin_password_hash: "CHANGE_ME"
